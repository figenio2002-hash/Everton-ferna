
name: Build Beyond Cheats APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ''

      - name: Instalar SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -o BeyondCheats-Projeto.zip -d .

      - name: Compilar APK
        working-directory: BeyondCheats
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BeyondCheats-APK
          path: BeyondCheats/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
